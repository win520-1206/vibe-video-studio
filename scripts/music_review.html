<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音乐节奏与段落复核</title>
<style>body{background:#081119;color:#d8e4ed;font:16px/1.6 system-ui;max-width:1100px;margin:35px auto;padding:0 20px}h1{font-size:27px}button,input{font:inherit;background:#142634;color:inherit;border:1px solid #456174;border-radius:7px;padding:6px 12px;margin:4px}audio{width:100%}canvas{width:100%;height:200px;background:#101d28;cursor:crosshair}section{margin:25px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #29404e}.note{color:#a9bccb}#status{color:#ecc78c}</style>
<h1>音乐节奏、段落与声画动作复核</h1><p id="source"></p><p class="note">点击曲线定位；点击候选从前2秒播放。分析是候选，不等于乐器、小节或高潮已经确认。试听后可记录人工标记并导出，导出不会自动修改影片时间轴。</p>
<audio id="audio" controls preload="metadata" src="preview.wav"></audio><canvas id="wave" width="1100" height="200"></canvas><p id="status"></p>
<section><h2>段落进入与冲击候选</h2><div id="options"></div></section><section><h2>人工复核标记</h2><input id="note" placeholder="写明听到的变化或视觉用途" size="38"><button id="mark">记录当前播放位置</button><button id="export">导出人工复核JSON</button><div id="marks"></div></section>
<section><h2>段落变化证据</h2><table><thead><tr><th>选段时间</th><th>类型</th><th>前段RMS → 后段RMS</th></tr></thead><tbody id="sections"></tbody></table></section>
<script>
const data=__DATA__,a=data.analysis,audio=document.querySelector('#audio'),canvas=document.querySelector('#wave'),g=canvas.getContext('2d'),markers=[];document.querySelector('#source').textContent=`${a.source} · ${a.duration.toFixed(2)}秒 · 原曲起点${a.mapping.sourceStartSeconds}秒`;
function draw(){g.clearRect(0,0,1100,200);g.strokeStyle='#92d2db';g.beginPath();const max=data.rms.reduce((m,v)=>Math.max(m,v),.0001);for(let i=0;i<data.rms.length;i++){const x=i/data.rms.length*1100,y=185-data.rms[i]/max*165;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();for(const p of a.impactCandidates){const x=p.atSeconds/a.duration*1100;g.strokeStyle='#d4b274';g.beginPath();g.moveTo(x,0);g.lineTo(x,200);g.stroke()}g.strokeStyle='#fff';g.beginPath();g.moveTo(audio.currentTime/a.duration*1100,0);g.lineTo(audio.currentTime/a.duration*1100,200);g.stroke()}
canvas.onclick=e=>{audio.currentTime=Math.max(0,Math.min(a.duration,(e.clientX-canvas.getBoundingClientRect().left)/canvas.getBoundingClientRect().width*a.duration));draw()};audio.ontimeupdate=()=>{draw();document.querySelector('#status').textContent=`选段 ${audio.currentTime.toFixed(3)}s / 原曲 ${(audio.currentTime+a.mapping.sourceStartSeconds).toFixed(3)}s`};
for(const p of a.visualPhrases){const b=document.createElement('button');b.textContent=`进入候选 ${p.atSeconds.toFixed(2)}s`;b.onclick=()=>{audio.currentTime=Math.max(0,p.atSeconds-2);audio.play().catch(()=>{})};document.querySelector('#options').append(b)}
for(const p of a.impactCandidates){const b=document.createElement('button');b.textContent=`冲击候选 ${p.atSeconds.toFixed(2)}s`;b.onclick=()=>{audio.currentTime=Math.max(0,p.atSeconds-2);audio.play().catch(()=>{})};document.querySelector('#options').append(b)}
for(const p of a.sectionTransitions){const row=document.createElement('tr');for(const v of [p.atSeconds.toFixed(2)+'s',p.kind,`${p.beforeRms.toFixed(4)} → ${p.afterRms.toFixed(4)}`]){const td=document.createElement('td');td.textContent=v;row.append(td)}document.querySelector('#sections').append(row)}
document.querySelector('#mark').onclick=()=>{const note=document.querySelector('#note').value.trim();if(!note){document.querySelector('#status').textContent='先填写实际听到的变化或用途';return}markers.push({id:'manual-'+(markers.length+1),sourceSeconds:audio.currentTime+a.mapping.sourceStartSeconds,note});const p=document.createElement('p');p.textContent=`原曲 ${markers.at(-1).sourceSeconds.toFixed(3)}s：${note}`;document.querySelector('#marks').append(p)};
document.querySelector('#export').onclick=()=>{if(!markers.length){document.querySelector('#status').textContent='尚无人工标记，不导出已复核结论';return}const value={schemaVersion:1,sourceSha256:a.sourceSha256,selectionFingerprint:a.selectionFingerprint,manualMarkers:markers,reviewStatus:'user_recorded'};const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='music-review.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw();
</script></html>
